name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # The suite drives the CLI and starts real git repositories; it takes about eleven minutes on a
    # Windows workstation. A hang must fail the run rather than hold the queue for six hours.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor `pyproject.toml` declares, so it is tested rather than asserted.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e .

      # No credentials and no network: the suite builds its own repositories in scratch directories,
      # and every commit it makes pins its own author through `tests/_support.py`. A run that needs
      # something a stranger does not have proves nothing about a stranger's machine.
      - name: Test
        run: python -m pytest tests -q

  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e .

      # The tool's own two commands, in the order a user runs them. The gate runs the suite under the
      # recorded coverage floor and appends the run record; the audit then has a record to read. On a
      # fresh clone with no record the audit reports one `[gate-record]` divergence -- which is the
      # documented first-clone behaviour, and why this order is the point rather than an accident.
      - name: Run the ratified gate
        run: python -m keelcheck gate run .

      - name: Audit the repository against its charter
        run: python -m keelcheck audit .

      # A `--version` that disagrees with the packaged metadata is a number a user cannot act on.
      - name: The version the entry point prints is the one pyproject declares
        run: |
          python - <<'PY'
          import pathlib
          import subprocess
          import sys
          import tomllib

          declared = tomllib.loads(
              pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          )["project"]["version"]
          printed = subprocess.run(
              [sys.executable, "-m", "keelcheck", "--version"],
              capture_output=True,
              text=True,
              check=True,
          ).stdout.split()[-1]
          assert printed == declared, (
              f"--version prints {printed!r}; pyproject declares {declared!r}"
          )
          print(f"keelcheck --version: {printed} (agrees with pyproject)")
          PY
