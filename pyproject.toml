[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keel"
version = "0.0.1"
description = "One frozen human-approved original; requirements that name their mechanism or are marked wishes; hashed gates; an audit that reports divergence."
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Max Reischl" }]
keywords = ["charter", "audit", "agents", "gates", "intent"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
keel = "keel.cli:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["keel"]

[tool.pytest.ini_options]
# pytest's transient cache directories (`pytest-cache-files-*`) were created in the repository root
# mode 0700, and on this host a confined directory under the root then breaks *collection* -- two
# errors and exit 2 in the worktree while the same revision from `git archive` is green. Keeping the
# existing ignore rule does not stop pytest recursing into them, so the cache is pinned here and the
# name is excluded from collection (F4, twice; the second time it was blocking the coverage gate).
cache_dir = ".pytest_cache"
norecursedirs = [".*", "build", "dist", "*.egg", "pytest-cache-files-*", "node_modules"]
