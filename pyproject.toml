[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keelcheck"
version = "0.0.1"
description = "One frozen human-approved original; requirements that name their mechanism or are marked wishes; hashed gates; an audit that reports divergence."
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Max Reischl" }]
keywords = ["charter", "audit", "agents", "gates", "intent"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
keelcheck = "keelcheck.cli:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["keelcheck"]

[tool.pytest.ini_options]
# pytest's transient cache directories (`pytest-cache-files-*`) were created in the repository root
# mode 0700, and on this host a confined directory under the root then breaks *collection* -- two
# errors and exit 2 in the worktree while the same revision from `git archive` is green. Keeping the
# existing ignore rule does not stop pytest recursing into them, so `testpaths` keeps collection
# inside `tests/` whatever else is lying in the root (F4, twice; the second time it was blocking the
# coverage gate).
#
# `cache_dir` is deliberately **not** set here, though it is a valid key. The gate runs pytest with
# `-p no:cacheprovider`, which disables the plugin that owns the key, so pytest then reports the key
# as unknown -- a correct configuration reading as a broken one, which is what Gilbert measured. The
# underlying host condition is measured too (2026-10-15): pytest creates its cache directory through
# `tempfile.TemporaryDirectory` (mode 0700) and this sandbox refuses writes inside such a directory,
# so a run that keeps the plugin leaves another `pytest-cache-files-*` behind and warns. Nothing here
# changes that; `testpaths` and `norecursedirs` are what make it harmless.
testpaths = ["tests"]
norecursedirs = [".*", "build", "dist", "*.egg", "pytest-cache-files-*", "node_modules"]
